@if (config() && config()?.isEnabled && config()?.whatsappUrl) {
  <aside
    class="fixed right-6 sm:right-8 z-40 flex items-center group print:hidden transition-all duration-300 ease-in-out"
    [ngClass]="hasScrollToTop ? 'bottom-24' : 'bottom-8'"
    aria-label="WhatsApp Contact">
    
    <!-- Tooltip badge on hover -->
    <div
      class="hidden sm:flex items-center gap-2 mr-3 px-3.5 py-1.5 bg-gray-900/90 text-white text-xs font-semibold rounded-full shadow-lg backdrop-blur-md transition-all duration-200 opacity-0 group-hover:opacity-100 translate-x-2 group-hover:translate-x-0 pointer-events-none whitespace-nowrap border border-white/10">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      <span>{{ 'common.chat_whatsapp' | translate }}</span>
    </div>

    <!-- WhatsApp Floating Action Button -->
    <a
      [href]="config()!.whatsappUrl"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="'common.chat_whatsapp' | translate"
      class="relative w-14 h-14 rounded-full bg-[#25D366] hover:bg-[#20bd5a] text-white flex items-center justify-center shadow-lg shadow-emerald-600/30 hover:shadow-xl hover:shadow-emerald-600/40 transform hover:scale-110 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-emerald-400/40">
      
      <svg class="w-7 h-7 text-white fill-current" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0012.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 012.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 01-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.26-1.5-1.4-1.76-.15-.25-.02-.39.11-.51.11-.11.25-.29.38-.44.12-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.3z"/>
      </svg>
    </a>
  </aside>
}
