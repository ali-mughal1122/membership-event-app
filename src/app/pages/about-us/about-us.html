<!-- Page Header -->
<div class="relative bg-gray-950 py-24 mb-16 overflow-hidden w-full">
  <div
    class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1517400508447-f8dd518b86db?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-20 mix-blend-overlay">
  </div>
  <div class="absolute inset-0 bg-gradient-to-t from-gray-950 to-transparent"></div>
  <div
    class="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-b from-blue-600/30 to-emerald-600/30 blur-3xl mix-blend-screen">
  </div>

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center z-10">
    <div
      class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 backdrop-blur-md border border-white/20 mb-6 shadow-xl mx-auto">
      <span class="w-2.5 h-2.5 rounded-full bg-blue-400 animate-pulse"></span>
      <span class="text-sm font-semibold text-blue-100 tracking-wide uppercase">{{ 'about.hero.badge' | translate }}</span>
    </div>
    <h1 class="text-5xl md:text-7xl font-black text-white tracking-tight mb-6 leading-[1.1]">
      {{ 'about.hero.title' | translate }} <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-400 drop-shadow-sm">{{ 'about.hero.title_accent' | translate }}</span>
    </h1>
    <p class="mt-4 text-xl text-gray-300 max-w-2xl mx-auto font-medium leading-relaxed">
      {{ 'about.hero.subtitle' | translate }}
    </p>
  </div>
</div>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24 space-y-24">

  <!-- Introduction Columns -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-12 lg:gap-24">
    <div>
      <p class="text-xl text-gray-600 leading-relaxed font-medium">{{ 'about.intro.col2' | translate }}</p>
    </div>
  </div>

  <!-- Main Banner Image -->
  <div
    class="rounded-[2.5rem] overflow-hidden shadow-2xl shadow-gray-300/50 border border-gray-100 relative group h-64 md:h-96">
    <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=2070&auto=format&fit=crop"
      alt="Taxi Door" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
    <div class="absolute inset-0 bg-gradient-to-t from-gray-900/60 to-transparent mix-blend-overlay"></div>
  </div>

  <!-- Content Section with Image -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
    <div
      class="order-2 lg:order-1 rounded-[2.5rem] overflow-hidden shadow-2xl shadow-blue-900/10 border border-gray-100 relative group h-80">
      <img
        src="https://eaca825d26.clvaw-cdnwnd.com/22260f85734dc704a60e6edb7709cf5a/200000016-3c2f83c2fa/images-pexels-com-photos-5647593-pexels-photo-5647593-auto-compress-cs-tinysrgb-dpr-2-h-650-w-940.webp?ph=eaca825d26"
        alt="Yellow Taxi" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
    </div>

    <div class="order-1 lg:order-2">
      <h2 class="text-4xl font-black text-gray-900 mb-6 tracking-tight">{{ 'about.terminal.title' | translate }}</h2>
      <p class="text-lg text-gray-600 leading-relaxed font-medium mb-6">{{ 'about.terminal.desc' | translate }}</p>
    </div>
  </div>

</div>
