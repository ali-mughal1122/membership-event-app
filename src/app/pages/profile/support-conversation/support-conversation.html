<div class="min-h-screen bg-gray-50/30 py-24 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto">
    <a routerLink="/profile" class="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 hover:text-blue-800 mb-6">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Back to Help & Support
    </a>

    @if (isLoading() && !conversation()) {
      <div class="bg-white rounded-[2rem] border border-gray-100 p-16 flex justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
      </div>
    } @else if (conversation(); as item) {
      <div class="bg-white rounded-[2rem] border border-gray-100 shadow-sm overflow-hidden flex flex-col min-h-[70vh]">
        <div class="px-6 py-5 border-b border-gray-100 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
          <div>
            <h1 class="text-2xl font-black text-gray-900">{{ item.subject }}</h1>
            <p class="text-sm text-gray-500 mt-1">{{ item.category?.name || 'Uncategorized' }}</p>
          </div>
          <span class="inline-flex self-start px-2.5 py-1 rounded-full text-xs font-bold border"
            [ngClass]="item.status === 'RESOLVED' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'">
            {{ item.status === 'RESOLVED' ? 'Resolved' : 'Open' }}
          </span>
        </div>

        <div #threadScroll class="flex-1 overflow-y-auto px-5 py-6 bg-gray-50/60">
          <app-support-thread [messages]="item.messages || []" viewer="MEMBER"></app-support-thread>
        </div>

        <form (submit)="$event.preventDefault(); send()" class="p-4 sm:p-5 border-t border-gray-100 bg-white">
          <div class="flex flex-col sm:flex-row gap-3">
            <textarea [(ngModel)]="draft" name="message" rows="2" maxlength="4000"
              class="flex-1 rounded-xl border border-gray-200 bg-gray-50 px-3.5 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 resize-none"
              placeholder="Write a reply..."></textarea>
            <button type="submit" [disabled]="isSending() || !draft.trim()"
              class="sm:self-end bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold px-5 py-3 rounded-xl">
              {{ isSending() ? 'Sending…' : 'Send' }}
            </button>
          </div>
        </form>
      </div>
    }
  </div>
</div>
