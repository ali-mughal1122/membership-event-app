name: CI/CD Pipeline (Contabo VPS)

on:
  push:
    branches:
      - stage
      - main

jobs:
  deploy:
    name: Deploy Angular Frontend
    runs-on: [self-hosted, contabo-vps]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Staging from stage branch
        if: github.ref == 'refs/heads/stage'
        run: |
          echo "Deploying Frontend stage branch to Staging on Contabo..."
          cd /opt/taxiterminalen/stage/frontend
          git fetch origin stage
          git reset --hard origin/stage
          cd /opt/taxiterminalen/stage
          docker compose build frontend
          docker compose up -d --no-deps frontend
          docker image prune -f

      - name: Deploy Frontend to Production from main branch
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying Frontend main branch to Production on Contabo..."
          cd /opt/taxiterminalen/prod/frontend
          git fetch origin main
          git reset --hard origin/main
          cd /opt/taxiterminalen/prod
          docker compose build frontend
          docker compose up -d --no-deps frontend
          docker image prune -f

      - name: Verify Health
        run: |
          sleep 5
          docker ps --filter "name=taxiterminalen-frontend"
