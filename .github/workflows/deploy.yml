name: CI/CD Pipeline (Contabo VPS)

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    name: Deploy Angular Frontend
    runs-on: [self-hosted, contabo-vps]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Staging (Branch: dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "Deploying Frontend to Staging on Contabo..."
          cd /opt/taxiterminalen/stage/frontend
          git fetch origin dev
          git reset --hard origin/dev
          cd /opt/taxiterminalen/stage
          docker compose build frontend
          docker compose up -d --no-deps frontend
          docker image prune -f

      - name: Deploy Production (Branch: main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying Frontend to Production on Contabo..."
          cd /opt/taxiterminalen/prod/frontend
          git fetch origin main
          git reset --hard origin/main
          cd /opt/taxiterminalen/prod
          docker compose build frontend
          docker compose up -d --no-deps frontend
          docker image prune -f

      - name: Verify Health
        run: |
          sleep 5
          docker ps --filter "name=taxiterminalen-frontend"
